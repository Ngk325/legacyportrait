# Follow-up emails (hourly) and data retention (daily).
# Deploy (Nick): cd workers/retention-cron && npx wrangler deploy && npx wrangler secret put ADMIN_TOKEN
name = "legacyportrait-retention"
main = "index.js"
compatibility_date = "2025-09-01"

[vars]
SITE_URL = "https://legacyportrait.pages.dev"

[triggers]
crons = ["17 * * * *"]   # hourly at :17; follow-ups every hour, retention in the 07:17 UTC run
