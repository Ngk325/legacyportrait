<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Legacy Portrait template</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page" id="page">
    <header>
      <div class="nameplate" id="nameplate"></div>
      <div class="dateline"><span id="vol"></span><span id="tagline"></span><span id="date"></span></div>
    </header>

    <section class="headline-block">
      <h1 class="headline" id="headline"></h1>
      <p class="subhead" id="subhead"></p>
      <div class="byline" id="byline"></div>
    </section>

    <section class="body" id="body">
      <div class="col" id="col1"></div>
      <div class="col" id="col2"></div>
      <div class="col" id="col3"></div>
      <figure class="main-photo" id="mainPhoto"></figure>
    </section>

    <footer class="footer" id="footer"></footer>
  </main>
  <script src="vendor/hyphen.js"></script>
  <script src="render.js"></script>
</body>
</html>
